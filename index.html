<!DOCTYPE html>
<html lang="ar" dir="rtl" x-data :dir="$store.app.dir" :lang="$store.app.lang" :class="{ 'high-contrast': $store.app.highContrast }" :style="{ '--font-scale': $store.app.fontScale }">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1a3a2a" />
  <meta name="description" content="منتقى كنز الأطفال - تعلم العقيدة بطريقة ممتعة" />
  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="منتقى" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>منتقى كنز الأطفال</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="fonts/fonts.css" />
  <link rel="stylesheet" href="style.css" />
  <script src="src/store-init.js"></script>
  <script defer src="lib/alpine.min.js"></script>
  <script type="module" src="src/boot.js"></script></head>
<body>

<!-- MAIN APP -->
<div id="app" x-data>

  <!-- SPLASH SCREEN (Alpine-driven — visible until store.appReady) -->
  <div id="splash" x-show="!$store.app.appReady" x-transition>
  <div class="splash-inner">
    <div class="splash-chest">
      <svg class="chest-svg-splash" viewBox="0 0 80 60" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- lid -->
        <rect class="chest-lid-splash" x="4" y="4" width="72" height="26" rx="6" fill="#5a3a1a" stroke="#d4a843" stroke-width="2"/>
        <rect x="10" y="10" width="60" height="14" rx="3" fill="#3d2510" stroke="#b8902c" stroke-width="1"/>
        <!-- body -->
        <rect x="4" y="28" width="72" height="28" rx="4" fill="#4a2e0e" stroke="#d4a843" stroke-width="2"/>
        <rect x="10" y="33" width="60" height="18" rx="2" fill="#3a2208" stroke="#b8902c" stroke-width="1"/>
        <!-- lock -->
        <rect x="33" y="24" width="14" height="12" rx="3" fill="#d4a843" stroke="#b8902c" stroke-width="1.5"/>
        <circle cx="40" cy="29" r="3" fill="#0f1f18" stroke="#b8902c" stroke-width="1"/>
        <!-- gold coins peek -->
        <ellipse cx="26" cy="44" rx="7" ry="4" fill="#d4a843" opacity="0.8"/>
        <ellipse cx="40" cy="42" rx="8" ry="4.5" fill="#f0c96a" opacity="0.9"/>
        <ellipse cx="54" cy="44" rx="7" ry="4" fill="#d4a843" opacity="0.8"/>
        <!-- band -->
        <rect x="4" y="26" width="72" height="5" rx="1" fill="#d4a843" opacity="0.6"/>
      </svg>
    </div>
    <h1 class="splash-title">كنز<br/>الأطفال</h1>
    <p class="splash-sub">تعلّم العقيدة الإسلامية</p>
    <div class="splash-dots">
      <span></span><span></span><span></span>
    </div>
  </div>
</div>

  <!-- END SPLASH -->

  <!-- TOP BAR -->
  <header class="topbar">
    <button class="icon-btn" id="menuToggle" @click="$store.app.toggleDrawer()" aria-label="القائمة">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
    <div class="topbar-title">
      <span id="appTitleEl" x-text="$store.app.appTitle"></span>
    </div>
    <div class="content-switch-wrapper" x-data="{ menuOpen: false }" @click.outside="menuOpen = false">
    <button class="icon-btn" id="contentToggle" @click="menuOpen = !menuOpen" :aria-expanded="menuOpen" aria-label="تغيير اللغة" title="تغيير اللغة">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
        <path d="M12,24C5.4,24,0,18.6,0,12S5.4,0,12,0s12,5.4,12,12S18.6,24,12,24z M9.5,17c0.6,3.1,1.7,5,2.5,5s1.9-1.9,2.5-5H9.5z M16.6,17c-0.3,1.7-0.8,3.3-1.4,4.5c2.3-0.8,4.3-2.4,5.5-4.5H16.6z M3.3,17c1.2,2.1,3.2,3.7,5.5,4.5c-0.6-1.2-1.1-2.8-1.4-4.5H3.3 z M16.9,15h4.7c0.2-0.9,0.4-2,0.4-3s-0.2-2.1-0.5-3h-4.7c0.2,1,0.2,2,0.2,3S17,14,16.9,15z M9.2,15h5.7c0.1-0.9,0.2-1.9,0.2-3 S15,9.9,14.9,9H9.2C9.1,9.9,9,10.9,9,12C9,13.1,9.1,14.1,9.2,15z M2.5,15h4.7c-0.1-1-0.1-2-0.1-3s0-2,0.1-3H2.5C2.2,9.9,2,11,2,12 S2.2,14.1,2.5,15z M16.6,7h4.1c-1.2-2.1-3.2-3.7-5.5-4.5C15.8,3.7,16.3,5.3,16.6,7z M9.5,7h5.1c-0.6-3.1-1.7-5-2.5-5 C11.3,2,10.1,3.9,9.5,7z M3.3,7h4.1c0.3-1.7,0.8-3.3,1.4-4.5C6.5,3.3,4.6,4.9,3.3,7z"/>
      </svg>
    </button>
    <div class="content-popup" x-show="menuOpen" role="menu" aria-label="اختيار المحتوى">
      <template x-for="cf in $store.app.contentFiles" :key="cf.file">
        <button class="content-option-btn" :class="{ active: cf.file === $store.app.activeContent }" @click="menuOpen = false; $store.app.switchContent(cf.file)" x-text="cf.label" type="button"></button>
      </template>
    </div>
    <button class="icon-btn" id="settingsToggle" @click="$store.app.openSettings()" aria-label="settings">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
    <button class="icon-btn" id="searchToggle" @click="$store.app.toggleSearch()" aria-label="البحث">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    </button>
    </div>
  </header>

  <!-- SEARCH BAR -->
  <div id="searchBar" class="search-bar" x-show="$store.app.searchOpen" x-init="$watch('$store.app.search', () => $store.app.resetPagination())">
    <input type="text" id="searchInput" :placeholder="$store.app.CFG.ui?.searchPlaceholder || 'ابحث...'" autocomplete="off" x-model="$store.app.search" />
    <div class="search-scope">
      <button class="scope-btn" :class="{ 'active': $store.app.searchScope === 'both' }" @click="$store.app.setSearchScope('both')" data-scope="both" id="allSectionsFilter" x-text="$store.app.CFG.ui?.scopeAll || $store.app.CFG.ui?.allSectionsShort || 'الكل'">الكل</button>
      <button class="scope-btn" :class="{ 'active': $store.app.searchScope === 'q' }" @click="$store.app.setSearchScope('q')" data-scope="q" id="scopeQBtn" x-text="$store.app.CFG.ui?.scopeQ || 'س'">س</button>
      <button class="scope-btn" :class="{ 'active': $store.app.searchScope === 'a' }" @click="$store.app.setSearchScope('a')" data-scope="a" id="scopeABtn" x-text="$store.app.CFG.ui?.scopeA || 'ج'">ج</button>
    </div>
    <button id="searchClose" @click="$store.app.toggleSearch()">✕</button>
  </div>
  <div id="searchFilters" class="search-filters" x-show="$store.app.searchOpen">
    <button class="filter-pill" :class="{ active: $store.app.searchSection === 'all' }" @click="$store.app.setSearchSection('all')">الكل</button>
    <template x-for="sec in $store.app.SECTIONS" :key="sec">
      <button class="filter-pill" :class="{ active: $store.app.searchSection === sec }" @click="$store.app.setSearchSection(sec)" x-text="sec"></button>
    </template>
  </div>

  <!-- SIDE DRAWER -->
  <div id="overlay" class="overlay" x-show="$store.app.drawerOpen" @click="$store.app.closeDrawer()"></div>
  <nav id="drawer" class="drawer" :class="{ 'open': $store.app.drawerOpen }">
    <div class="drawer-header">
      <span id="drawerSectionsTitle" x-text="$store.app.CFG.ui?.allSectionsShort || 'الأبواب'"></span>
    </div>
    <ul id="sectionList" class="section-list">
      <li class="section-item" :class="{ active: $store.app.section === 'all' }" @click="$store.app.setSection('all')">
        <span x-text="$store.app.CFG.ui?.allSections || 'الكل'"></span>
        <span class="count" x-text="$store.app.toArabic($store.app.QA_DATA.length)"></span>
      </li>
      <template x-for="sec in $store.app.SECTIONS" :key="sec">
        <li class="section-item" :class="{ active: $store.app.section === sec }" @click="$store.app.setSection(sec)">
          <span x-text="sec"></span>
          <span class="count" x-text="$store.app.toArabic($store.app.sectionCounts[sec] || 0)"></span>
        </li>
      </template>
    </ul>
    <div class="drawer-footer">
    <button class="nav-pill" :class="{ 'active': $store.app.view === 'browse' }" @click="$store.app.switchView('browse')" data-view="browse" id="navBrowse"><span id="navBrowseDrawerLabel" x-text="$store.app.CFG.ui?.browseNav || 'تصفح'"></span></button>
      <button class="nav-pill" :class="{ 'active': $store.app.view === 'favorites' }" @click="$store.app.switchView('favorites')" data-view="favorites" id="navFavs"><span id="navFavsDrawerLabel" x-text="$store.app.CFG.ui?.favsNav || 'المحفوظات'"></span></button>
      <button class="nav-pill" :class="{ 'active': $store.app.view === 'quiz' }" @click="$store.app.switchView('quiz')" data-view="quiz" id="navQuiz"><span id="navQuizDrawerLabel" x-text="$store.app.CFG.ui?.quizNav || 'اختبار'"></span></button>
      <button class="nav-pill nav-pill-about" id="navAbout" @click="$store.app.openAbout()"><span id="navAboutLabel" x-text="$store.app.CFG.ui?.aboutBtn || 'عن التطبيق'"></span></button>
    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <main id="mainContent">

    <!-- BROWSE VIEW -->
    <div id="viewBrowse" class="view" :class="{ active: $store.app.view === 'browse' }">
      <div class="view-header">
        <div class="section-badge" id="currentSectionLabel" x-text="$store.app.section === 'all' ? $store.app.CFG.ui?.allSections : $store.app.section">جميع الأسئلة</div>
        <div class="counter-pill" id="counterPill" x-text="$store.app.toArabic($store.app.filteredCards.length) + ' ' + ($store.app.CFG.ui?.counterSuffix || '')">٣٠٨ سؤال</div>
      </div>
      <!-- CARD LIST -->
      <div id="cardList" class="card-list">
        <template x-for="(item, idx) in $store.app.browseCards" :key="item.qa.id + '-' + $store.app.cardVersion">
          <div class="qa-card-wrap" :class="{ open: $store.app.openCards.includes(item.qa.id) }" x-data="qaCard(item.qa, item.matchIn)">
            <div class="qa-card-flipper">
              <!-- FRONT FACE -->
              <div class="qa-face qa-face-front">
                <div class="qa-card-header" @click="toggle()">
                  <span class="qa-num" x-text="$store.app.CFG.ui?.questionNum?.replace('{n}', $store.app.toArabic(qa.id))"></span>
                  <span class="qa-question" x-html="hlQuery ? buildHighlight(qa.q, hlQuery) : escHtml(qa.q)"></span>
                  <button class="qa-toggle" x-ref="toggleBtn" @click.stop="toggle()" :aria-label="$store.app.CFG.ui?.showAnswer">
                    <span x-html="window.CHEST_SVG || ''"></span>
                  </button>
                </div>
                <div class="qa-footer">
                  <span class="qa-section-tag" x-text="qa.section"></span>
                  <div class="card-actions">
                    <template x-if="$store.app.CFG.meta?.audio">
                      <button class="play-btn" @click.stop="playAudio($event)" :class="{ playing: $store.app.playingCardId === qa.id }" :aria-label="$store.app.CFG.ui?.listen">
                        <span x-html="$store.app.playingCardId === qa.id ? $store.app.stopSVG : $store.app.playSVG"></span>
                      </button>
                    </template>
                    <button class="fav-btn" :class="{ active: $store.app.favorites.includes(qa.id) }" @click.stop="toggleFav($event)" :aria-label="$store.app.CFG.ui?.save">
                      <span x-html="favStarSVG($store.app.favorites.includes(qa.id))"></span>
                    </button>
                  </div>
                </div>
              </div>
              <!-- BACK FACE -->
              <div class="qa-face qa-face-back" @click="toggle()">
                <div class="qa-back-header">
                  <span class="qa-num" x-text="$store.app.CFG.ui?.questionNum?.replace('{n}', $store.app.toArabic(qa.id))"></span>
                  <span class="qa-back-label" x-text="$store.app.CFG.ui?.answerLabel"></span>
                  <button class="qa-toggle qa-toggle-back" x-ref="toggleBtn" @click.stop="toggle()" :aria-label="$store.app.CFG.ui?.close">
                    <span x-html="window.CHEST_SVG || ''"></span>
                  </button>
                </div>
                <div class="qa-back-divider"></div>
                <div class="qa-answer-body">
                  <p class="qa-answer-text" x-html="hlQuery ? buildHighlight(qa.a, hlQuery) : escHtml(qa.a)"></p>
                </div>
                <div class="qa-footer">
                  <span class="qa-section-tag" x-text="qa.section"></span>
                  <div class="card-actions">
                    <template x-if="$store.app.CFG.meta?.audio">
                      <button class="play-btn" @click.stop="playAudio($event)" :class="{ playing: $store.app.playingCardId === qa.id }" :aria-label="$store.app.CFG.ui?.listen">
                        <span x-html="$store.app.playingCardId === qa.id ? $store.app.stopSVG : $store.app.playSVG"></span>
                      </button>
                    </template>
                    <button class="fav-btn" :class="{ active: $store.app.favorites.includes(qa.id) }" @click.stop="toggleFav($event)" :aria-label="$store.app.CFG.ui?.save">
                      <span x-html="favStarSVG($store.app.favorites.includes(qa.id))"></span>
                    </button>
                    <button class="copy-btn" @click.stop="copyQA($event)" :aria-label="$store.app.CFG.ui?.copyText">
                      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                    </button>
                    <button class="share-img-btn" @click.stop="shareImage($event)" :aria-label="$store.app.CFG.ui?.shareImage">
                      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </template>
      </div>

      <!-- PAGINATION STRIP (compact for narrow screens) -->
      <nav class="pagination" x-show="$store.app.pageCount > 1" aria-label="تنقّل الصفحات">
        <template x-for="(pg, idx) in $store.app.pagerItems" :key="idx + '-' + pg.type">
          <button
            class="page-btn"
            type="button"
            :class="{ active: pg.type === 'page' && pg.page === $store.app.currentPage, disabled: pg.disabled, 'is-ellipsis': pg.type === 'ellipsis' }"
            :disabled="pg.disabled"
            @click="$store.app.goToPage(pg.page)"
            x-text="pg.label"
          ></button>
        </template>
      </nav>

      <div id="noResults" class="no-results" x-show="$store.app.filteredCards.length === 0">
        <div class="no-results-icon">✦</div>
        <p>لا توجد نتائج</p>
      </div>
    </div>

    <!-- FAVORITES VIEW -->
    <div id="viewFavorites" class="view" :class="{ active: $store.app.view === 'favorites' }">
      <div class="view-header">
        <div class="section-badge" x-text="$store.app.CFG.ui?.favoritesTitle || 'المحفوظات'">المحفوظات</div>
        <div class="counter-pill" x-text="$store.app.toArabic($store.app.favorites.length) + ' ' + ($store.app.CFG.ui?.counterSuffix || '')">٠</div>
      </div>
      <div id="favList" class="card-list">
        <template x-for="qa in $store.app.QA_DATA.filter(q => $store.app.favorites.includes(q.id))" :key="qa.id + '-' + $store.app.cardVersion">
          <div class="qa-card-wrap" :class="{ open: $store.app.openCards.includes(qa.id) }" x-data="qaCard(qa)">
            <div class="qa-card-flipper">
              <div class="qa-face qa-face-front">
                <div class="qa-card-header" @click="toggle()">
                  <span class="qa-num" x-text="$store.app.CFG.ui?.questionNum?.replace('{n}', $store.app.toArabic(qa.id))"></span>
                  <span class="qa-question" x-text="qa.q"></span>
                  <button class="qa-toggle" x-ref="toggleBtn" @click.stop="toggle()">
                    <span x-html="window.CHEST_SVG || ''"></span>
                  </button>
                </div>
                <div class="qa-footer">
                  <span class="qa-section-tag" x-text="qa.section"></span>
                  <div class="card-actions">
                    <button class="fav-btn active" @click.stop="toggleFav($event)">
                      <span x-html="favStarSVG(true)"></span>
                    </button>
                  </div>
                </div>
              </div>
              <div class="qa-face qa-face-back" @click="toggle()">
                <div class="qa-back-header">
                  <span class="qa-num" x-text="$store.app.CFG.ui?.questionNum?.replace('{n}', $store.app.toArabic(qa.id))"></span>
                  <span class="qa-back-label" x-text="$store.app.CFG.ui?.answerLabel"></span>
                  <button class="qa-toggle qa-toggle-back" x-ref="toggleBtn" @click.stop="toggle()">
                    <span x-html="window.CHEST_SVG || ''"></span>
                  </button>
                </div>
                <div class="qa-back-divider"></div>
                <div class="qa-answer-body">
                  <p class="qa-answer-text" x-text="qa.a"></p>
                </div>
                <div class="qa-footer">
                  <span class="qa-section-tag" x-text="qa.section"></span>
                  <div class="card-actions">
                    <button class="fav-btn active" @click.stop="toggleFav($event)">
                      <span x-html="favStarSVG(true)"></span>
                    </button>
                    <button class="copy-btn" @click.stop="copyQA($event)" :aria-label="$store.app.CFG.ui?.copyText">
                      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                    </button>
                    <button class="share-img-btn" @click.stop="shareImage($event)" :aria-label="$store.app.CFG.ui?.shareImage">
                      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </template>
      </div>
      <div id="noFavs" class="no-results" x-show="$store.app.favorites.length === 0">
        <div class="no-results-icon">✦</div>
        <p x-text="$store.app.CFG.ui?.noFavsTitle || 'لا توجد محفوظات بعد!'"></p>
        <small x-text="$store.app.CFG.ui?.noFavsHint || 'اضغط على أي سؤال لحفظه'"></small>
      </div>
    </div>

    <!-- QUIZ VIEW -->
    <div id="viewQuiz" class="view" :class="{ active: $store.app.view === 'quiz' }">
      <div id="quizSetup" class="quiz-setup" x-show="$store.app.quizPhase === 'setup'">
        <div class="quiz-chest-wrap">
          <svg class="quiz-chest-svg" viewBox="0 0 80 60" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="4" y="4" width="72" height="26" rx="6" fill="#5a3a1a" stroke="#d4a843" stroke-width="2"/>
            <rect x="10" y="10" width="60" height="14" rx="3" fill="#3d2510" stroke="#b8902c" stroke-width="1"/>
            <rect x="4" y="28" width="72" height="28" rx="4" fill="#4a2e0e" stroke="#d4a843" stroke-width="2"/>
            <rect x="10" y="33" width="60" height="18" rx="2" fill="#3a2208" stroke="#b8902c" stroke-width="1"/>
            <rect x="33" y="24" width="14" height="12" rx="3" fill="#d4a843" stroke="#b8902c" stroke-width="1.5"/>
            <circle cx="40" cy="29" r="3" fill="#0f1f18" stroke="#b8902c" stroke-width="1"/>
            <ellipse cx="26" cy="44" rx="7" ry="4" fill="#d4a843" opacity="0.8"/>
            <ellipse cx="40" cy="42" rx="8" ry="4.5" fill="#f0c96a" opacity="0.9"/>
            <ellipse cx="54" cy="44" rx="7" ry="4" fill="#d4a843" opacity="0.8"/>
            <rect x="4" y="26" width="72" height="5" rx="1" fill="#d4a843" opacity="0.6"/>
          </svg>
        </div>
        <h2 id="quizHeaderLabel" x-text="$store.app.CFG.ui?.quizHeader || 'اختبر نفسك!'"></h2>
        <p id="quizSubHeaderLabel" x-text="$store.app.CFG.ui?.quizSubHeader || 'اختر البابَ وعدَدَ الأسئلة'"></p>
        <select id="quizSection" class="quiz-select" x-model="$store.app.quizSection">
          <option value="all" id="allChaptersOpt" x-text="$store.app.CFG.ui?.allChapters || 'جميع الأبواب'"></option>
          <template x-for="sec in $store.app.SECTIONS" :key="sec">
            <option x-bind:value="sec" x-text="sec"></option>
          </template>
          <option value="__weak__" id="weakOption" x-show="$store.app.weakPool.length > 0" x-text="$store.app.weakOptionLabel"></option>
        </select>
        <div class="quiz-count-row">
          <label id="questionCountLabel" x-text="$store.app.CFG.ui?.questionCount || 'عدد الأسئلة:'"></label>
          <div class="count-btns">
            <button class="count-btn" :class="{ 'active': $store.app.quizCount === 5 }" @click="$store.app.setQuizCount(5)">٥</button>
            <button class="count-btn" :class="{ 'active': $store.app.quizCount === 10 }" @click="$store.app.setQuizCount(10)">١٠</button>
            <button class="count-btn" :class="{ 'active': $store.app.quizCount === 20 }" @click="$store.app.setQuizCount(20)">٢٠</button>
          </div>
        </div>
        <div class="quiz-mode-row">
          <label id="quizTypeLabel" x-text="$store.app.CFG.ui?.quizType || 'نوع الاختبار:'"></label>
          <div class="mode-btns">
            <button class="mode-btn" :class="{ 'active': $store.app.quizMode === 'mcq' }" @click="$store.app.setQuizMode('mcq')" title="اختر الجواب الصحيح">
              <span class="mode-icon">؟</span>
              <span class="mode-label" id="modeMCQLabel" x-text="$store.app.CFG.ui?.modeMCQ || 'اختيار'"></span>
            </button>
            <button class="mode-btn" :class="{ 'active': $store.app.quizMode === 'build' }" @click="$store.app.setQuizMode('build')" title="رتّب كلمات الجواب">
              <span class="mode-icon">⧉</span>
              <span class="mode-label" id="modeBuildLabel" x-text="$store.app.CFG.ui?.modeBuild || 'ترتيب'"></span>
            </button>
            <button class="mode-btn" :class="{ 'active': $store.app.quizMode === 'blank' }" @click="$store.app.setQuizMode('blank')" title="أكمل الكلمة الناقصة">
              <span class="mode-icon">_</span>
              <span class="mode-label" id="modeBlankLabel" x-text="$store.app.CFG.ui?.modeBlank || 'تكميل'"></span>
            </button>
            <button class="mode-btn" :class="{ 'active': $store.app.quizMode === 'listen' }" @click="$store.app.setQuizMode('listen')" title="استمع واختر السؤال" x-show="$store.app.CFG.meta?.audio">
              <span class="mode-icon">♪</span>
              <span class="mode-label" id="modeListenLabel" x-text="$store.app.CFG.ui?.modeListen || 'استماع'"></span>
            </button>
          </div>
        </div>
        <button id="startQuiz" class="start-btn" @click="$store.app.initQuiz()" x-text="$store.app.CFG.ui?.startQuiz || 'ابدأ الاختبار'"></button>
      </div>

      <div id="quizGame" class="quiz-game" x-show="$store.app.quizPhase === 'game'">
        <div class="quiz-progress-wrap">
          <div class="quiz-progress-bar"><div id="quizProgressFill" :style="{ width: $store.app.quizProgress + '%' }"></div></div>
          <span id="quizProgressText" x-text="$store.app.toArabic($store.app.quizCurrent + 1) + ' / ' + $store.app.toArabic($store.app.quizQuestions.length)"></span>
        </div>
        <div class="quiz-score-badge" x-text="($store.app.CFG.ui?.score || 'النقاط') + ': ' + $store.app.toArabic($store.app.quizScore)"></div>
        <div class="quiz-card" x-ref="quizCard">
          <div class="quiz-q-num" x-text="$store.app.CFG.ui?.questionNum?.replace('{n}', $store.app.toArabic($store.app.currentQuestion?.id || 0))"></div>
          <div class="quiz-q-text" x-text="$store.app.currentQuestion?.q || ''"></div>

          <!-- MCQ MODE -->
          <div id="quizChoices" class="quiz-choices" x-show="$store.app.quizMode === 'mcq'">
            <template x-for="(choice, idx) in $store.app.quizChoices" :key="choice.text">
              <button class="choice-btn"
                :class="{ correct: $store.app.quizAnswered && choice.isCorrect, wrong: $store.app.quizAnswered && !choice.isCorrect && choice.selected }"
                :disabled="$store.app.quizAnswered"
                x-text="choice.text"
                @click="$store.app.selectMCQChoice(choice, $refs.quizCard)"></button>
            </template>
          </div>

          <!-- BUILD MODE -->
          <div id="buildZone" class="build-zone" x-show="$store.app.quizMode === 'build'">
            <div id="buildAnswer" class="build-answer" x-ref="buildAnswer" :class="{ 'build-correct': $store.app.quizFeedbackType === 'correct', 'build-wrong': $store.app.quizFeedbackType === 'wrong' }">
              <template x-if="$store.app.buildPlaced.length === 0">
                <span class="build-placeholder" x-text="$store.app.CFG.ui?.placeTilesHint || 'اضغط الكلمات بالترتيب'"></span>
              </template>
              <template x-for="(pw, idx) in $store.app.buildPlaced" :key="pw.id">
                <span class="build-placed-tile removable" @click="$store.app.removeBuildTile(idx)" x-text="pw.word"></span>
              </template>
            </div>
            <div class="build-divider"></div>
            <div id="buildPool" class="build-pool">
              <template x-for="(pw, idx) in $store.app.buildPool" :key="pw.id">
                <button class="build-tile" :class="{ placed: pw.placed }" :disabled="$store.app.quizAnswered" @click="$store.app.placeBuildTile(idx)" x-text="pw.word"></button>
              </template>
            </div>
            <button id="buildCheck" class="build-check-btn" x-show="$store.app.buildPlaced.length >= ($store.app.currentQuestion?.a?.trim().split(/\s+/).length || 0) && !$store.app.quizAnswered" @click="$store.app.checkBuildAnswer($refs.buildAnswer)"><span id="buildCheckLabel">تحقق ✓</span></button>
          </div>

          <!-- BLANK MODE -->
          <div id="blankZone" class="blank-zone" x-show="$store.app.quizMode === 'blank'">
            <div id="blankText" class="blank-text" x-html="$store.app.blankHtml()"></div>
            <div id="blankChoices" class="blank-choices">
              <template x-for="(word, idx) in $store.app.blankOptions" :key="idx + '-' + word">
                <button class="blank-choice-btn"
                  :class="{ correct: $store.app.quizAnswered && word === $store.app.blankCorrect, wrong: $store.app.quizAnswered && word === $store.app.blankFilled && word !== $store.app.blankCorrect }"
                  :disabled="$store.app.quizAnswered"
                  @click="$store.app.selectBlankChoice(word, $refs.quizCard)"
                  x-text="word"></button>
              </template>
            </div>
          </div>

          <!-- LISTEN MODE -->
          <div id="listenZone" class="listen-zone" x-show="$store.app.quizMode === 'listen'">
            <button id="listenPlay" class="listen-play-btn" :class="{ playing: $store.app.listenPlaying }" :disabled="$store.app.listenError" @click="$store.app.playListenAudio()">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
              <span id="listenBtnLabel" x-text="$store.app.listenBtnText || ($store.app.CFG.ui?.listen || 'استمع')"></span>
            </button>
            <div id="listenChoices" class="listen-choices">
              <template x-for="(choice, idx) in $store.app.listenChoices" :key="choice.text">
                <button class="choice-btn listen-q-choice"
                  :class="{ correct: $store.app.quizAnswered && choice.isCorrect, wrong: $store.app.quizAnswered && !choice.isCorrect && choice.selected }"
                  :disabled="$store.app.quizAnswered"
                  @click="$store.app.selectListenChoice(choice, $refs.quizCard)"
                  x-text="choice.text"></button>
              </template>
            </div>
          </div>

          <div id="quizFeedback" class="quiz-feedback" x-show="$store.app.quizFeedbackType" :class="{ correct: $store.app.quizFeedbackType === 'correct', wrong: $store.app.quizFeedbackType === 'wrong' }" x-html="$store.app.quizFeedbackText"></div>
        </div>
        <button id="nextQuizBtn" class="next-btn" x-show="$store.app.quizAnswered" @click="$store.app.nextQuizQuestion()" x-text="$store.app.CFG.ui?.next || 'التالي ←'"></button>
      </div>

      <div id="quizResult" class="quiz-result" x-show="$store.app.quizPhase === 'result'">
        <div class="result-emoji-wrap">
          <svg class="result-chest" viewBox="0 0 80 60" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="22" cy="46" rx="9" ry="5" fill="#c9982a" opacity="0.85"/>
            <ellipse cx="40" cy="43" rx="11" ry="6" fill="#e8bf5a" opacity="0.95"/>
            <ellipse cx="58" cy="46" rx="9" ry="5" fill="#c9982a" opacity="0.85"/>
            <rect x="4" y="28" width="72" height="28" rx="4" fill="#4a2e0e" stroke="#c9982a" stroke-width="2"/>
            <rect x="10" y="33" width="60" height="18" rx="2" fill="#3a2208" stroke="#a07820" stroke-width="1"/>
            <rect x="33" y="24" width="14" height="12" rx="3" fill="#c9982a" stroke="#a07820" stroke-width="1.5"/>
            <circle cx="40" cy="29" r="3" fill="#0c1a12" stroke="#a07820" stroke-width="1"/>
            <rect x="4" y="26" width="72" height="5" rx="1" fill="#c9982a" opacity="0.55"/>
            <rect x="4" y="2" width="72" height="28" rx="6" fill="#6a4520" stroke="#c9982a" stroke-width="2" transform="rotate(-20 40 15)"/>
          </svg>
        </div>
        <h2 x-text="$store.app.quizResultTitle || 'أحسنت!'">أحسنت!</h2>
        <div class="result-score" x-text="$store.app.quizResultScore"></div>
        <p x-text="$store.app.quizResultMsg"></p>
        <button class="start-btn" @click="$store.app.retryQuiz()" x-text="$store.app.CFG.ui?.retry || 'مرة أخرى'"></button>
      </div>
    </div>

  </main>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <button class="bnav-btn" :class="{ 'active': $store.app.view === 'browse' }" @click="$store.app.switchView('browse')" data-view="browse">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span id="navBrowseLabel" x-text="$store.app.CFG.ui?.browseNav || 'تصفح'"></span>
    </button>
    <button class="bnav-btn" :class="{ 'active': $store.app.view === 'favorites' }" @click="$store.app.switchView('favorites')" data-view="favorites">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      <span id="navFavsLabel" x-text="$store.app.CFG.ui?.favsNav || 'محفوظات'"></span>
    </button>
    <button class="bnav-btn" :class="{ 'active': $store.app.view === 'quiz' }" @click="$store.app.switchView('quiz')" data-view="quiz">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      <span id="navQuizLabel" x-text="$store.app.CFG.ui?.quizNav || 'اختبار'"></span>
    </button>
  </nav>

  <!-- ABOUT MODAL -->
  <div id="aboutOverlay" class="about-overlay" x-show="$store.app.aboutOpen" @click="$store.app.closeAbout()">
    <div class="about-modal" @click.stop>
      <button class="about-close" id="aboutClose" @click="$store.app.closeAbout()" aria-label="close">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>

      <div class="about-chest">
        <svg viewBox="0 0 80 60" fill="none" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="22" cy="46" rx="9" ry="5" fill="#c9982a" opacity="0.85"/>
          <ellipse cx="40" cy="43" rx="11" ry="6" fill="#e8bf5a" opacity="0.95"/>
          <ellipse cx="58" cy="46" rx="9" ry="5" fill="#c9982a" opacity="0.85"/>
          <rect x="4" y="28" width="72" height="28" rx="4" fill="#4a2e0e" stroke="#c9982a" stroke-width="2"/>
          <rect x="10" y="33" width="60" height="18" rx="2" fill="#3a2208" stroke="#a07820" stroke-width="1"/>
          <rect x="33" y="24" width="14" height="12" rx="3" fill="#c9982a" stroke="#a07820" stroke-width="1.5"/>
          <circle cx="40" cy="29" r="3" fill="#0c1a12" stroke="#a07820" stroke-width="1"/>
          <rect x="4" y="26" width="72" height="5" rx="1" fill="#c9982a" opacity="0.55"/>
          <rect x="4" y="2" width="72" height="28" rx="6" fill="#6a4520" stroke="#c9982a" stroke-width="2" transform="rotate(-18 40 15)"/>
        </svg>
      </div>

      <h1 class="about-title" id="aboutTitle" x-text="$store.app.CFG.about?.title || ''"></h1>
      <div class="about-divider"></div>
      <div class="about-body" id="aboutBody" x-html="$store.app.aboutBodyHtml"></div>

    </div>
  </div>

  <!-- SETTINGS OVERLAY -->
  <div id="settingsOverlay" class="settings-overlay" x-show="$store.app.settingsOpen" @click="$store.app.closeSettings()">
    <div class="settings-modal" @click.stop>
      <div class="settings-header">
        <span id="settingsTitleEl" x-text="$store.app.CFG.ui?.settingsTitle || 'الإعدادات'"></span>
        <button class="settings-close-btn" id="settingsClose" @click="$store.app.closeSettings()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div id="settingsPanel">
        <div class="settings-row">
          <span class="settings-label" x-text="$store.app.CFG.ui?.fontSizeLabel || 'حجم الخط'"></span>
          <div class="settings-btns">
            <button class="font-btn" :class="{ active: $store.app.fontSize === 'sm' }" @click="$store.app.applyFontSize('sm')">A</button>
            <button class="font-btn" :class="{ active: $store.app.fontSize === 'md' }" @click="$store.app.applyFontSize('md')">A</button>
            <button class="font-btn" :class="{ active: $store.app.fontSize === 'lg' }" @click="$store.app.applyFontSize('lg')">A</button>
          </div>
        </div>
        <div class="settings-row">
          <span class="settings-label" x-text="$store.app.CFG.ui?.contrastLabel || 'وضع التباين'"></span>
          <button class="settings-toggle" :class="{ active: $store.app.highContrast }" @click="$store.app.toggleContrast()">
            <span class="toggle-knob"></span>
          </button>
        </div>
        <div class="settings-row">
          <span class="settings-label" x-text="$store.app.CFG.ui?.shareAppUrl || 'مشاركة رابط التطبيق'"></span>
          <button class="settings-action-btn" @click="$store.app.shareAppUrl()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- TOAST (reactive — CSS owns the animation via .show) -->
  <div class="toast" :class="{ show: $store.app.toastVisible }" x-text="$store.app.toastMessage"></div>

  <!-- SPARKLE LAYER (reactive effect owner — renders particles from store trigger) -->
  <div class="sparkle-layer" x-data="sparkleLayer()" aria-hidden="true"></div>

</div>

</body>
</html>
